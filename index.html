<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <meta name="description" content="Portfolio.OS — portfólio de Arthur Costa, desenvolvedor em formação.">
    <title>Portfolio.OS | Arthur Costa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/main.js" defer></script>
    <script src="js/windows.js" defer></script>
    <script src="js/animations.js" defer></script>
</head>
<body>
<section id="boot-screen" class="boot-screen" aria-label="Inicialização do Portfolio.OS">
    <div class="boot-content">
        <div class="boot-logo" aria-hidden="true">&gt;_</div>
        <p class="eyebrow">ARTHUR COSTA / WORKSPACE</p>
        <h1>Portfolio<span>.OS</span></h1>
        <p>Inicializando seu universo digital...</p>
        <div class="progress-track" aria-hidden="true">
            <div class="progress-bar"></div>
        </div>
    </div>
</section>

<main id="desktop" class="desktop" hidden>
    <header class="topbar">
        <div class="brand"><span class="brand-icon">&gt;_</span> Portfolio.OS <span class="version">v1.0</span></div>
        <div class="topbar-right"><span class="status-dot"></span><span>Sistema online</span>
            <time id="clock" aria-label="Horário atual"></time>
        </div>
    </header>

    <section class="hero" aria-label="Apresentação">
        <h2>Arthur <span>Costa.</span></h2>
        <p class="hero-role">Estudante de ADS • Desenvolvedor em formação</p>
        <p class="hero-description">Transformando curiosidade em código, projetos e soluções digitais.</p>
        <div class="hero-actions">
            <button type="button" class="btn btn-primary" data-open="projects">Explorar projetos ↗</button>
            <button type="button" class="btn btn-ghost" data-open="about">Sobre mim</button>
        </div>
    </section>

    <nav class="desktop-icons" aria-label="Aplicativos do portfólio">
        <button class="app-icon" data-open="about"><span class="app-symbol">◉</span><span>Sobre mim</span></button>
        <button class="app-icon" data-open="projects"><span class="app-symbol">▣</span><span>Projetos</span></button>
        <button class="app-icon" data-open="skills"><span class="app-symbol">⌘</span><span>Tecnologias</span></button>
        <button class="app-icon" data-open="career"><span class="app-symbol">▤</span><span>Trajetória</span></button>
        <button class="app-icon" data-open="resume"><span class="app-symbol">▧</span><span>Currículo</span></button>
        <button class="app-icon" data-open="contact"><span class="app-symbol">✉</span><span>Contato</span></button>
    </nav>

    <div id="window-layer" class="window-layer" aria-live="polite"></div>
</main>
</body>
</html>
